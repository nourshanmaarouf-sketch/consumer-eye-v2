function ratingLine(score,n,size){if(!n)return '<span class="small muted">لا تقييمات بعد</span>';return '<span class="row" style="gap:6px">'+starsRow(score,size||13)+'<span class="sc">'+fmt(score)+'</span><span class="small muted">('+n+')</span></span>';}
function ibtn(act,icon,attrs,bg,color){return '<button class="ib" data-act="'+act+'" '+(attrs||'')+' aria-label="'+E(icon)+'" style="'+(bg?'background:'+bg+';':'')+(color?'color:'+color:'')+'">'+ic(icon,20)+'</button>';}
function backBtn(){return '<button class="ib" data-act="back" aria-label="رجوع">'+ic('back',20)+'</button>';}
function topbar(title,right){return '<div class="row" style="justify-content:space-between;padding:16px"><div class="row" style="gap:12px">'+backBtn()+'<span style="font-size:18px;font-weight:700">'+E(title)+'</span></div>'+(right||'')+'</div>';}
function empty(icon,title,sub,btn){return '<div class="empty"><div class="circle">'+ic(icon,40,'currentColor',1.8)+'</div><b>'+E(title)+'</b><p>'+E(sub)+'</p>'+(btn||'')+'</div>';}
function nav(active){var items=[['home','home'],['search','search'],['fab','plus'],['me-saved','bookmark'],['me','user']];
 return '<nav class="nav" aria-label="التنقل">'+items.map(function(it){if(it[0]==='fab')return '<button class="fab" data-act="fab" aria-label="إضافة">'+ic('plus',26,'#fff',2.6)+'</button>';var on=(active===it[0]);return '<button class="'+(on?'on':'')+'" data-go="'+it[0]+'" aria-label="'+it[0]+'"'+(on?' aria-current="page"':'')+'>'+ic(it[1],24)+'</button>';}).join('')+'</nav>';}
function placeCard(p){var st=placeStats(p.id),c=catOf(p.cat);return '<button class="pc" data-go="place-'+E(p.id)+'"><div class="img">'+ic(c.i,40,'currentColor',1.5)+'</div><div class="b"><span class="nm">'+E(p.name)+'</span><span class="small muted">'+E(c.n)+'</span>'+ratingLine(st.score,st.n,12)+'</div></button>';}
function placeRow(p){var st=placeStats(p.id),c=catOf(p.cat);return '<button class="hc" data-go="place-'+E(p.id)+'"><div class="img">'+ic(c.i,34,'currentColor',1.5)+'</div><div class="b"><div><div class="nm">'+E(p.name)+'</div><div class="small muted">'+E(c.n)+(p.address?' · '+E(p.address):'')+'</div></div>'+ratingLine(st.score,st.n,13)+'</div></button>';}
function dishCard(d){var st=dishStats(d.id);return '<button class="card" data-go="dish-'+E(d.id)+'" style="border:0;padding:8px;text-align:right;display:block"><div style="height:92px;border-radius:10px;background:#EFE3CE;display:flex;align-items:center;justify-content:center;color:var(--gold-strong)">'+ic('utensils',32,'currentColor',1.5)+'</div><div class="col" style="gap:6px;padding:10px 2px 4px"><span class="nm">'+E(d.name)+'</span>'+ratingLine(st.score,st.n,12)+'</div></button>';}
function reviewCard(r,opts){opts=opts||{};var pl=placeById(r.placeId),dsh=r.dishId?dishById(r.dishId):null;
 var sc=r.kind==='dish'?avg([r.s.taste,r.s.price]):avg([r.s.service,r.s.clean]);
 var lines=r.kind==='dish'?[['الطعم',r.s.taste],['السعر',r.s.price]]:[['الخدمة',r.s.service],['النظافة',r.s.clean]];
 var title=opts.showTarget?'<button class="link" data-go="'+(r.kind==='dish'&&dsh?'dish-'+E(dsh.id):'place-'+E(r.placeId))+'" style="font-size:14px;font-weight:700;color:var(--ink)">'+E(r.kind==='dish'&&dsh?dsh.name:(pl?pl.name:'مكان محذوف'))+(r.kind==='dish'&&pl?' <span class="small muted" style="font-weight:500">· '+E(pl.name)+'</span>':'')+'</button>':'';
 var who=opts.showTarget?'':'<div class="row" style="gap:10px"><span class="avatar">'+E(nameOf(r.by).charAt(0))+'</span><div class="col"><span style="font-weight:700;font-size:13px" data-uid="'+E(r.by)+'">'+E(nameOf(r.by))+'</span><span class="small muted">'+E(r.kind==='dish'?'قيّم طبقاً':'قيّم المكان')+' · '+fmtDate(r.ts)+'</span></div></div>';
 return '<div class="card rv">'+who+title+'<div class="row" style="gap:8px">'+starsRow(sc,16)+'<span class="sc">'+fmt(sc)+'</span><span class="small muted">'+lines.map(function(l){return l[0]+' '+l[1];}).join(' · ')+'</span></div>'+(r.text?'<p style="line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere">'+E(r.text)+'</p>':'')+
  (opts.showTarget?'<div class="row" style="justify-content:space-between"><span class="small muted">'+fmtDate(r.ts)+'</span>'+(r.by===S.uid?'<button class="link" style="color:var(--err)" data-act="delreview" data-id="'+E(r.id)+'">'+ic('trash',14,'currentColor')+' حذف</button>':'')+'</div>':'')+'</div>';}
function loadingView(){var card='<div class="pc"><div class="img"></div><div class="b"><i class="sk" style="width:90%;height:10px;border-radius:9px"></i><i class="sk2" style="width:60%;height:8px;border-radius:9px"></i></div></div>';
 var sec='<div class="col" style="gap:10px;margin-top:20px"><div style="padding:0 16px"><i class="sk" style="width:110px;height:14px;border-radius:9px"></i></div><div class="hscroll">'+card+card+card+'</div></div>';
 return '<div class="screen shm"><div class="row" style="padding:16px;gap:10px"><img src="logo-mark.png" alt="" width="40" height="40"><b style="font-size:18px">بيستاهل</b></div>'+sec+sec+'<div class="grow"></div>'+nav('home')+'</div>';}
function offlineView(msg){return '<div class="screen"><div class="grow" style="flex:.7"></div>'+empty('wifioff','تعذّر الاتصال بالبيانات',msg||'تحقق من اتصالك ثم افتح الصفحة مرة أخرى')+'<div class="grow"></div></div>';}

/* ---------- الشاشات ---------- */
function vSplash(){return '<div class="screen"><div class="deco1"></div><div class="deco2"></div><div class="grow" style="flex:1.1"></div><div class="col" style="align-items:center"><img src="logo-mark.png" alt="" width="144" height="144"><h1 style="margin-top:22px;font-size:36px;font-weight:700">بيستاهل</h1></div><div class="grow" style="flex:1.4"></div><div class="row" style="justify-content:center;gap:8px;margin-bottom:80px"><i class="" style="width:10px;height:10px;border-radius:50%;background:var(--orange)"></i><i style="width:10px;height:10px;border-radius:50%;background:var(--orange);opacity:.4"></i><i style="width:10px;height:10px;border-radius:50%;background:var(--orange);opacity:.4"></i></div></div>';}
var ONB=[{t:'اكتشف أفضل الأماكن',d:'ابحث عن المطاعم والمقاهي ومحلات الحلويات وشاهد تقييمات الناس',i:'search'},{t:'قيّم الطبق والمكان بشكل منفصل',d:'للطبق طعم وسعر، وللمكان خدمة ونظافة، فيكون التقييم أدق',i:'star'},{t:'احفظ أماكنك المفضلة',d:'احفظ ما يعجبك لتعود إليه بسهولة وشارك تجربتك مع الآخرين',i:'bookmark'}];
function vOnb(){var i=S.onb||0,o=ONB[i];return '<div class="screen"><div class="deco1"></div><div class="deco2"></div><div class="row" style="padding:20px 16px"><button class="link" data-act="onbskip" style="font-size:14px">تخطي</button></div><div class="grow" style="flex:.5"></div><div class="col" style="align-items:center"><div style="width:220px;height:220px;border-radius:50%;background:#EFE3CE;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--orange-strong)">'+ic(o.i,84,'currentColor',1.4)+'</div></div><div class="col" style="align-items:center;text-align:center;gap:12px;padding:36px 32px 0"><span style="font-size:24px;font-weight:700">'+E(o.t)+'</span><span style="font-size:14px;line-height:24px" class="muted">'+E(o.d)+'</span></div><div class="grow"></div><div class="col" style="gap:22px;padding:0 16px 32px;position:relative"><div class="dotsr">'+ONB.map(function(_,k){return '<i class="'+(k===i?'on':'')+'"></i>';}).join('')+'</div><button class="btn" data-act="onbnext">'+(i===ONB.length-1?'ابدأ':'التالي')+'</button></div></div>';}

function unreadCount(){var seen=LS.get('seen_notif',0);return notifs().filter(function(n){return n.ts>seen;}).length;}
function notifs(){var mine={};S.places.forEach(function(p){if(p.by===S.uid)mine[p.id]=1;});return S.reviews.filter(function(r){return mine[r.placeId]&&r.by!==S.uid;}).sort(function(a,b){return b.ts-a.ts;});}
function vHome(){
 var ps=S.places;var head='<div class="row" style="justify-content:space-between;padding:16px 16px 4px"><div class="row" style="gap:10px"><img src="logo-mark.png" alt="" width="40" height="40"><span style="font-size:18px;font-weight:700">بيستاهل</span></div><button class="ib" data-go="notif" aria-label="الإشعارات" style="position:relative">'+ic('bell',20)+(unreadCount()?'<i style="position:absolute;top:8px;left:10px;width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid #fff"></i>':'')+'</button></div>';
 var sb='<div style="padding:12px 16px 10px"><button class="row" data-go="search" style="width:100%;height:46px;border-radius:999px;background:#fff;border:0;box-shadow:0 2px 8px rgba(57,39,25,.08);padding:0 16px;gap:10px;color:var(--muted)">'+ic('search',18)+'<span style="flex:1;text-align:right">ابحث عن مكان أو طبق</span>'+ic('filter',18)+'</button></div>';
 var cats='<div class="hscroll" style="gap:14px;padding:8px 16px 4px">'+CATS.map(function(c){return '<button data-act="cat" data-id="'+c.id+'" class="col" style="align-items:center;gap:8px;flex:none;background:none;border:0;width:64px"><span style="width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(57,39,25,.08);display:flex;align-items:center;justify-content:center;color:var(--orange-strong)">'+ic(c.i,26)+'</span><span style="font-size:12px;font-weight:600">'+c.n+'</span></button>';}).join('')+'</div>';
 var body='';
 if(!ps.length){body=empty('pin','لا توجد أماكن بعد','كن أول من يضيف مكاناً ويشارك تقييمه','<button class="btn" style="width:auto;padding:0 32px;margin-top:8px" data-go="addplace">إضافة مكان</button>');}
 else{var top=ps.filter(function(p){return placeStats(p.id).n>0;}).sort(function(a,b){return placeStats(b.id).score-placeStats(a.id).score;}).slice(0,10);
  var pop=ps.slice().sort(function(a,b){return placeStats(b.id).n-placeStats(a.id).n;}).filter(function(p){return placeStats(p.id).n>0;}).slice(0,10);
  var fresh=ps.slice().sort(function(a,b){return b.ts-a.ts;}).slice(0,10);
  var sec=function(t,list,sort){return list.length?'<div class="col" style="gap:10px;margin-top:18px"><div class="row" style="justify-content:space-between;padding:0 16px"><span class="h2">'+t+'</span><button class="link" data-act="seeall" data-sort="'+sort+'">عرض الكل '+ic('chevL',14)+'</button></div><div class="hscroll">'+list.map(placeCard).join('')+'</div></div>':'';};
  body=sec('الأعلى تقييماً',top,'rating')+sec('الأكثر تقييماً',pop,'count')+sec('أُضيفت حديثاً',fresh,'new');}
 return '<div class="screen">'+head+sb+cats+body+'<div style="height:24px"></div>'+nav('home')+'</div>';}

function filtered(){var q=S.q.trim().toLowerCase(),F=S.F;var list=S.places.filter(function(p){
  if(F.cat&&p.cat!==F.cat)return false;
  if(F.min&&placeStats(p.id).score<F.min)return false;
  if(q){var hit=(p.name||'').toLowerCase().indexOf(q)>-1||(p.address||'').toLowerCase().indexOf(q)>-1||catOf(p.cat).n.indexOf(q)>-1||S.dishes.some(function(d){return d.placeId===p.id&&(d.name||'').toLowerCase().indexOf(q)>-1;});if(!hit)return false;}
  return true;});
 list.sort(function(a,b){if(F.sort==='count')return placeStats(b.id).n-placeStats(a.id).n;if(F.sort==='new')return b.ts-a.ts;return placeStats(b.id).score-placeStats(a.id).score||placeStats(b.id).n-placeStats(a.id).n;});return list;}
function resultsHtml(){var q=S.q.trim(),F=S.F;
 if(!q&&!F.cat&&!F.min&&!S.showAll){var rec=LS.get('recent',[]);
  return '<div class="col" style="padding:8px 16px 0;gap:4px">'+(rec.length?'<div class="row" style="justify-content:space-between;padding:8px 0"><span class="h2">عمليات البحث الأخيرة</span><button class="link" data-act="clearrecent">مسح الكل</button></div>'+rec.map(function(t){return '<button class="row" data-act="recent" data-q="'+E(t)+'" style="gap:12px;height:48px;border:0;border-bottom:1px solid #F0E4D2;background:none;text-align:right;width:100%"><span class="muted">'+ic('clock',18)+'</span><span style="flex:1">'+E(t)+'</span></button>';}).join(''):'')+'</div><div class="col" style="padding:20px 0 0;gap:10px"><span class="h2" style="padding:0 16px">التصنيفات</span><div class="chips">'+CATS.map(function(c){return '<button class="chip" data-act="cat" data-id="'+c.id+'">'+ic(c.i,16)+c.n+'</button>';}).join('')+'</div></div>';}
 var list=filtered();
 if(!list.length)return empty('search','لا توجد نتائج','جرّب كلمات بحث أخرى أو غيّر الفلاتر','<button class="btn out" style="width:auto;padding:0 28px;margin-top:6px" data-act="resetf">مسح الفلاتر</button>');
 return '<div class="col" style="gap:12px;padding:8px 16px 20px"><span class="small muted">'+list.length+' نتيجة</span>'+list.map(placeRow).join('')+'</div>';}
function vSearch(){var F=S.F;var on=F.cat||F.min||F.sort!=='rating';
 var bar='<div class="row" style="gap:10px;padding:16px 16px 10px">'+backBtn()+'<div class="row" style="flex:1;height:46px;background:#fff;border-radius:999px;padding:0 14px;gap:8px;box-shadow:0 2px 8px rgba(57,39,25,.08)"><span class="muted">'+ic('search',17)+'</span><input id="q" type="search" enterkeyhint="search" placeholder="ابحث عن مكان أو طبق" value="'+E(S.q)+'" style="flex:1;border:0;outline:0;background:none;min-width:0"><button data-act="sheetfilter" aria-label="تصفية" style="border:0;background:none;color:'+(on?'var(--orange-strong)':'var(--muted)')+'">'+ic('filter',18)+'</button></div></div>';
 var chips='<div class="chips"><button class="chip '+(!F.cat?'on':'')+'" data-act="cat" data-id="">الكل</button>'+CATS.map(function(c){return '<button class="chip '+(F.cat===c.id?'on':'')+'" data-act="cat" data-id="'+c.id+'">'+c.n+'</button>';}).join('')+'</div>';
 return '<div class="screen">'+bar+chips+'<div id="res">'+resultsHtml()+'</div><div class="grow"></div>'+nav('search')+'</div>';}
function filterSheet(){var F=S.F,T={rating:'الأعلى تقييماً',count:'الأكثر تقييماً',new:'الأحدث'};
 return '<div class="ov" data-act="closesheet"><div class="sheet" data-stop="1" role="dialog" aria-label="تصفية النتائج"><div class="handle"></div><div class="row" style="justify-content:space-between;padding:0 16px"><b style="font-size:18px">تصفية النتائج</b><button class="ib" data-act="closesheet" aria-label="إغلاق" style="width:36px;height:36px">'+ic('x',18)+'</button></div>'+
 '<div class="col" style="gap:10px"><span class="h2" style="padding:0 16px">التصنيف</span><div class="chips"><button class="chip '+(!F.cat?'on':'')+'" data-act="fcat" data-id="">الكل</button>'+CATS.map(function(c){return '<button class="chip '+(F.cat===c.id?'on':'')+'" data-act="fcat" data-id="'+c.id+'">'+c.n+'</button>';}).join('')+'</div></div>'+
 '<div class="col" style="gap:10px"><span class="h2" style="padding:0 16px">الترتيب</span><div class="chips">'+Object.keys(T).map(function(k){return '<button class="chip '+(F.sort===k?'on':'')+'" data-act="fsort" data-id="'+k+'">'+T[k]+'</button>';}).join('')+'</div></div>'+
 '<div class="col" style="gap:10px;padding:0 16px"><span class="h2">أدنى تقييم</span><div class="row" style="gap:4px">'+[1,2,3,4,5].map(function(v){return '<button class="star-btn" data-act="fmin" data-v="'+v+'" aria-label="'+v+'">'+ic('star',32,'#B8892E',1.8,v<=F.min?'#B8892E':'none')+'</button>';}).join('')+(F.min?'<button class="link" data-act="fmin" data-v="0" style="margin-right:8px">إزالة</button>':'')+'</div></div>'+
 '<div class="row" style="gap:12px;padding:6px 16px 0"><button class="btn" style="flex:1.6" data-act="closesheet">عرض النتائج</button><button class="btn out" style="flex:1" data-act="resetf">إعادة ضبط</button></div></div></div>';}

function vPlace(id,tab){var p=placeById(id);if(!p)return '<div class="screen">'+topbar('المكان')+empty('pin','المكان غير موجود','ربما حُذف أو لم يُحمّل بعد','<button class="btn out" style="width:auto;padding:0 28px" data-go="home">الرئيسية</button>')+'</div>';
 var st=placeStats(id),c=catOf(p.cat);tab=tab||'ratings';
 var hero='<div class="hero">'+ic(c.i,72,'currentColor',1.2)+'<div class="t">'+backBtn()+'<div class="row" style="gap:8px">'+ibtn('share','share','data-act="share"')+ibtn('save','bookmark','data-type="place" data-id="'+E(id)+'"',null,isSaved('place',id)?'#F4770B':null)+'</div></div></div>';
 var info='<div class="card info"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px"><div class="col" style="gap:8px;min-width:0"><span style="font-size:20px;font-weight:700;overflow-wrap:anywhere">'+E(p.name)+'</span><span class="pill" style="align-self:flex-start">'+E(c.n)+'</span></div>'+(st.n?'<div class="col" style="align-items:center;gap:4px"><span style="font-size:28px;font-weight:700;line-height:1">'+fmt(st.score)+'</span>'+starsRow(st.score,13)+'<span class="small muted">'+st.n+' تقييم</span></div>':'<span class="small muted">لا تقييمات بعد</span>')+'</div>'+((p.address||p.hours)?'<div style="height:1px;background:#F3E9D8"></div><div class="col" style="gap:10px">'+(p.address?'<div class="row" style="gap:10px;color:var(--orange-strong)">'+ic('pin',18)+'<span style="color:var(--ink)">'+E(p.address)+'</span></div>':'')+(p.hours?'<div class="row" style="gap:10px;color:var(--orange-strong)">'+ic('clock',18)+'<span style="color:var(--ink)">'+E(p.hours)+'</span></div>':'')+'</div>':'')+'</div>';
 var tabs='<div class="tabs" style="margin-top:14px">'+[['ratings','التقييمات'],['dishes','الأطباق'],['reviews','الآراء']].map(function(t){return '<button class="tab '+(tab===t[0]?'on':'')+'" data-go="place-'+E(id)+'-'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>';
 var body='';
 if(tab==='ratings'){var row=function(l,v){return '<div class="row" style="gap:14px"><span style="font-size:14px;font-weight:600;width:56px">'+l+'</span><div class="bar"><i style="width:'+(v/5*100)+'%"></i></div><span class="sc" style="width:28px;text-align:left">'+(v?fmt(v):'–')+'</span></div>';};
  body='<div class="card col" style="margin:14px 16px 0;padding:16px;gap:14px"><span class="h2">تقييم المكان</span>'+row('الخدمة',st.service)+row('النظافة',st.clean)+'</div><div class="card col" style="margin:12px 16px 0;padding:16px;gap:14px"><span class="h2">متوسط تقييم الأطباق</span>'+row('الطعم',st.taste)+row('السعر',st.price)+'<span class="small muted">من '+st.dn+' تقييم للأطباق</span></div>';}
 if(tab==='dishes'){var ds=S.dishes.filter(function(d){return d.placeId===id;}).sort(function(a,b){return dishStats(b.id).score-dishStats(a.id).score;});
  body=ds.length?'<div class="grid2" style="margin-top:14px">'+ds.map(dishCard).join('')+'</div>':empty('utensils','لا توجد أطباق بعد','أضف طبقاً عند تقييمه ليظهر هنا');}
 if(tab==='reviews'){var rs=S.reviews.filter(function(r){return r.placeId===id;}).sort(function(a,b){return b.ts-a.ts;});
  body=rs.length?'<div class="col" style="gap:12px;padding:14px 16px 0">'+rs.map(function(r){return reviewCard(r);}).join('')+'</div>':empty('msg','لا توجد آراء بعد','كن أول من يشارك رأيه عن هذا المكان');}
 return '<div class="screen">'+hero+info+tabs+body+'<div style="height:20px"></div><div class="bbar"><button class="btn" data-go="add-'+E(id)+'">إضافة تقييم</button></div></div>';}
function vDish(id){var d=dishById(id);if(!d)return '<div class="screen">'+topbar('الطبق')+empty('utensils','الطبق غير موجود','ربما حُذف أو لم يُحمّل بعد','<button class="btn out" style="width:auto;padding:0 28px" data-go="home">الرئيسية</button>')+'</div>';

 switch(r.name){case 'search':return vSearch();case 'place':return vPlace(r.a,r.b);case 'dish':return vDish(r.a);case 'add':return vAdd(r.a,r.b);case 'addplace':return vAddPlace();case 'done':return vDone();case 'me':return vMe(r.a==='saved'?'saved':r.a==='activity'?'activity':'reviews');case 'notif':return vNotif();case 'editprofile':return vEdit();case 'settings':return vSettings();default:return vHome();}}

 if(FORM[r.name]&&a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!S._force)return;S._force=false;
 var app=document.getElementById('app'),y=window.scrollY;
 app.innerHTML=view()+(S.sheet==='fab'?fabSheet():'')+(S.sheet==='filter'?filterSheet():'')+(S.dlg?dialogDel():'')+(S.toast?'<div class="toast" role="status">'+E(S.toast)+'</div>':'');

 resolveNames();}

 seeall:function(el){S.F={cat:'',sort:el.dataset.sort||'rating',min:0};S.q='';S.showAll=true;go('search');},
 sheetfilter:function(){S.sheet='filter';render(true);},
 fcat:function(el){S.F.cat=el.dataset.id||'';render(true);},fsort:function(el){S.F.sort=el.dataset.id;render(true);},
 fmin:function(el){var v=+el.dataset.v;S.F.min=(S.F.min===v?0:v);render(true);},
 resetf:function(){S.F={cat:'',sort:'rating',min:0};S.q='';S.showAll=false;S.sheet=null;S._force=true;render(true);},
 recent:function(el){S.q=el.dataset.q;S.showAll=true;S._force=true;render(true);},
 clearrecent:function(){LS.set('recent',[]);render(true);},
 share:function(){var u=location.href;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast('تم نسخ الرابط');},function(){toast(u);});}else toast(u);},
 save:function(el){if(!S.db||!S.uid){toast('الحفظ غير متاح حالياً');return;}var type=el.dataset.type,id=el.dataset.id,key=type+'_'+id,ref=S.db.collection('data/users/'+S.uid).doc(key);
  var done=isSaved(type,id)?ref.delete():ref.set({type:type,id:id,ts:Date.now()});done.catch(function(){toast('تعذّر الحفظ');});},
 kind:function(el){S.draft.kind=el.dataset.v;S._force=true;render(true);},
 star:function(el){S.draft.s[el.dataset.k]=+el.dataset.v;S._force=true;render(true);},
 pcat:function(el){S.pdraft.cat=el.dataset.id;S._force=true;render(true);},
 publish:function(el){var D=S.draft;if(!D||!S.db||!S.uid)return;el.disabled=true;var isDish=D.kind==='dish',now=Date.now(),chain=Promise.resolve(),dishId=D.dishId;
  if(isDish&&dishId==='__new'){dishId='d'+uid();var nd={placeId:D.placeId,name:D.newDish.trim(),by:S.uid,ts:now};chain=S.db.collection('dishes').doc(dishId).set(nd);}
  chain.then(function(){var target=isDish?dishId:D.placeId;var rev={kind:isDish?'dish':'place',placeId:D.placeId,dishId:isDish?dishId:'',by:S.uid,s:isDish?{taste:D.s.taste,price:D.s.price}:{service:D.s.service,clean:D.s.clean},text:D.text.trim(),ts:now};
   return S.db.collection('reviews').doc(S.uid+'_'+target).set(rev);}).then(function(){S.draft=null;go('done');}).catch(function(){el.disabled=false;toast('تعذّر نشر التقييم. تحقق من صلاحياتك');});},
 saveplace:function(el){var P=S.pdraft;if(!P||!S.db||!S.uid)return;el.disabled=true;var id='p'+uid();S.db.collection('places').doc(id).set({name:P.name.trim(),cat:P.cat,address:P.address.trim(),hours:P.hours.trim(),by:S.uid,ts:Date.now()}).then(function(){S.pdraft=null;go('place-'+id);}).catch(function(){el.disabled=false;toast('تعذّرت إضافة المكان. تحقق من صلاحياتك');});},
 savebio:function(el){if(!S.db||!S.uid)return;el.disabled=true;S.db.collection('profiles').doc(S.uid).set({bio:(S.edraft?S.edraft.bio:'').trim()}).then(function(){S.edraft=null;toast('تم حفظ الملف');go('me');}).catch(function(){el.disabled=false;toast('تعذّر الحفظ');});},
 delreview:function(el){S.dlg={id:el.dataset.id};render(true);},
 confirmdel:function(){var id=S.dlg&&S.dlg.id;S.dlg=null;render(true);if(!id)return;S.db.collection('reviews').doc(id).delete().then(function(){toast('تم حذف التقييم');}).catch(function(){toast('تعذّر الحذف');});}
};
document.addEventListener('click',function(e){
 var t=e.target;if(!t.closest)return;
 var inSheet=t.closest('[data-stop]'),ov=t.closest('.ov');
 var el=t.closest('[data-act],[data-go]');
 if(ov&&inSheet&&!el)return;
 if(ov&&!inSheet&&el===ov&&el.dataset.act){ACT[el.dataset.act]&&ACT[el.dataset.act](el);return;}
 if(!el)return;e.preventDefault();
 if(el.dataset.act&&ACT[el.dataset.act]){ACT[el.dataset.act](el);return;}
 if(el.dataset.go){var h=el.dataset.go;S.sheet=null;if(h==='add'){S.draft=null;}go(h);}
});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='q'){S.q=t.value;S.showAll=false;var r=document.getElementById('res');if(r)r.innerHTML=resultsHtml();return;}
 if(t.dataset.in&&S.draft){S.draft[t.dataset.in]=t.value;var b=document.querySelector('[data-act=publish]');if(b){var D=S.draft,isD=D.kind==='dish';b.disabled=!(D.placeId&&(isD?((D.dishId&&D.dishId!=='__new')||(D.dishId==='__new'&&D.newDish.trim()))&&D.s.taste>0&&D.s.price>0:(D.s.service>0&&D.s.clean>0)))||S.canWrite===false;}}
 if(t.dataset.pin&&S.pdraft){S.pdraft[t.dataset.pin]=t.value;var b2=document.querySelector('[data-act=saveplace]');if(b2)b2.disabled=!(S.pdraft.name.trim().length>1)||S.canWrite===false;}
 if(t.dataset.ein&&S.edraft){S.edraft[t.dataset.ein]=t.value;}
});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset.ch==='place'&&S.draft){S.draft.placeId=t.value;S.draft.dishId='';S._force=true;render(true);}
 if(t.dataset.ch==='dish'&&S.draft){S.draft.dishId=t.value;S._force=true;render(true);}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(S.sheet||S.dlg)){S.sheet=null;S.dlg=null;render(true);}
 if(e.key==='Enter'&&e.target.id==='q'){var q=S.q.trim();if(q){var rec=LS.get('recent',[]).filter(function(x){return x!==q;});rec.unshift(q);LS.set('recent',rec.slice(0,6));e.target.blur();}}});

/* ---------- الإقلاع ---------- */
function snap(coll,key,flag,map){return S.db.collection(coll).onSnapshot(function(s){S[key]=map?map(s):s.docs.map(function(d){return Object.assign({id:d.id},d.data());});if(flag)S.loaded[flag]=true;render();},function(er){S.err=(er&&er.code)||'error';render(true);});}
function startData(){
 snap('places','places','p');snap('dishes','dishes','d');snap('reviews','reviews','r');
 S.db.collection('profiles').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data();});S.profiles=m;render();},function(){});
 if(S.uid)S.db.collection('data/users/'+S.uid).onSnapshot(function(s){S.saves=s.docs.map(function(d){return d.data();}).filter(function(x){return x&&x.type&&x.id;});render();},function(){});
 setTimeout(function(){if(!(S.loaded.p&&S.loaded.d&&S.loaded.r)){S.slow=true;render(true);}},10000);}
function boot(){
 render(true);
 var start=route().raw;S.started=!!start;
 var after=function(){S.booted=true;var r=route();if(!r.name){go(LS.get('onb_seen',0)?'home':'onb');}else render(true);};
 var T=setTimeout(function(){},0);
 var cl=window.claude;
 var pDb=cl&&cl.use?cl.use('db'):Promise.resolve(null),pUser=cl&&cl.use?cl.use('user'):Promise.resolve(null);
 Promise.all([pDb,pUser]).then(function(r){S.db=r[0];S.user=r[1];
  if(!S.user)return null;
  return Promise.all([S.user.id(),S.user.me(),S.user.can?S.user.can('data.write'):null]).then(function(v){S.uid=v[0];S.myName=(v[1]&&v[1].name)||'';S.canWrite=v[2];});
 }).catch(function(){}).then(function(){
  if(S.db)startData();
  setTimeout(function(){after();},route().raw?0:1400);
  if(!S.db)setTimeout(function(){S.booted=true;render(true);},route().raw?0:1400);
 });}
boot();
})();
</script>
