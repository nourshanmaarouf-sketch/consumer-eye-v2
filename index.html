<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="عين المستهلك - مديرية التجارة الداخلية وحماية المستهلك في اللاذقية">
<title>عين المستهلك</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d241e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0a211b;--g2:#10332a;--g3:#17463a;--au:#c8a35d;--au2:#e6cc8c;--au3:#9a7835;--bg:#f6f3ea;--tx:#13201c;--mu:#66726c;--bd:#e3ddcc;--ok:#1f7a4d;--no:#a82a22;color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'IBM Plex Sans Arabic',Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
header{background:linear-gradient(165deg,#0f3027 0%,#0a211b 55%,#06150f 100%);color:#fff;padding-top:env(safe-area-inset-top,0px);position:relative;border-bottom:0}
header::after{content:"";display:block;height:3px;background:linear-gradient(90deg,#8a6a2c,#e6cc8c 50%,#8a6a2c)}
.hd{display:flex;align-items:center;gap:14px;padding:16px 18px 14px}
.hd>div:nth-child(2){flex:1;line-height:1.55}
.hd small{display:block;font-size:12.5px;color:#a9bdb5;font-weight:500}
.hd b{display:block;font-size:19px;font-weight:700;color:#fff;margin:1px 0 2px}
.hd span{font-size:13px;color:#cfdcd6}
#lg,.lg{width:64px;height:64px;border-radius:16px;object-fit:contain;background:#0b2a23;border:1.5px solid var(--au);box-shadow:0 0 0 3px rgba(200,163,93,.14),0 8px 20px -6px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:var(--au);font-size:26px;flex:none}
#out{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(200,163,93,.55);background:rgba(255,255,255,.04);color:var(--au2);display:none;align-items:center;justify-content:center;padding:0;flex:none}
#out svg{width:20px;height:20px}
.sub{background:#06130f;color:var(--au2);font-weight:600;font-size:13px;padding:10px 18px;border-top:1px solid rgba(255,255,255,.06)}
main{padding:18px 16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(10,33,27,.05),0 10px 24px -14px rgba(10,33,27,.28)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h2{margin:0 0 4px;font-size:20px;font-weight:700;color:var(--g);letter-spacing:0}
.mu{color:var(--mu);font-size:14px;margin:4px 0}
label{display:block;font-weight:600;margin:14px 0 7px;font-size:14px;color:#26352f}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--bd);border-radius:12px;background:#fbfaf6;color:var(--tx);transition:border-color .15s,box-shadow .15s,background .15s}
input::placeholder,textarea::placeholder{color:#9aa49f}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--au);background:#fff;box-shadow:0 0 0 4px rgba(200,163,93,.2)}
textarea{min-height:110px}
.ltr{direction:ltr;text-align:right}
.btn{display:block;width:100%;margin-top:16px;padding:15px;border:1px solid rgba(200,163,93,.45);border-radius:14px;background:linear-gradient(180deg,#143a30,#0a211b);color:var(--au2);font:inherit;font-weight:700;font-size:16px;box-shadow:0 10px 20px -10px rgba(10,33,27,.7),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .12s,box-shadow .12s}
.btn:active,.sm:active,.seg button:active,.chips button:active{transform:scale(.97)}
.btn.s{background:#fff;color:var(--g);border:1.5px solid var(--bd);margin-top:10px;box-shadow:none}
.sm{display:inline-block;padding:9px 16px;border-radius:11px;border:1px solid rgba(200,163,93,.45);font:inherit;font-weight:600;font-size:14px;background:linear-gradient(180deg,#143a30,#0a211b);color:var(--au2);text-decoration:none;transition:transform .12s}
.sm.n{background:#fff;color:var(--no);border:1.5px solid #e4b9b5}
.er{color:var(--no);font-size:14px;min-height:20px;margin-top:10px;font-weight:500}
.pr{font-weight:800;font-size:17px;color:var(--g)}
.up{color:var(--no)}.dn{color:var(--ok)}.eq{color:var(--mu)}
.tag{font-size:12px;padding:3px 10px;border-radius:20px;background:#f1e8cf;color:#6b5420;font-weight:600;border:1px solid #e4d5a8}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--no);font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);box-shadow:0 -8px 24px -12px rgba(10,33,27,.25);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{font-size:13.5px!important;flex:1;padding:15px 4px 13px;border:0;border-top:3px solid transparent;background:none;font:inherit;font-size:14px;color:var(--mu);transition:color .15s}
nav button.on{border-top-color:var(--au);color:var(--g);font-weight:800;background:linear-gradient(180deg,rgba(200,163,93,.14),transparent 70%)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.st .card{margin:0;text-align:center;padding:20px 12px 18px;transition:transform .12s}
.st .card:active{transform:scale(.98)}
.st b{font-size:28px;display:block;color:var(--g)}
.st b.bad{color:var(--no)}.st b.ok{color:var(--ok)}
.st .sel{background:linear-gradient(165deg,#164236,#0a211b);border-color:rgba(200,163,93,.55);color:#fff;box-shadow:0 14px 26px -14px rgba(10,33,27,.8),inset 0 1px 0 rgba(255,255,255,.08)}
.st .sel b{color:#fff}.st .sel .mu{color:#cfdcd6}
.ic{width:54px;height:54px;margin:0 auto 10px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fbf3dc,#f1e4bb);border:1px solid #e2cf9a;color:var(--g)}
.ic svg{width:28px;height:28px}
.sel .ic{background:rgba(200,163,93,.14);border-color:rgba(200,163,93,.6);color:var(--au2)}
#tt{position:fixed;bottom:calc(94px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:13px 20px;border-radius:14px;z-index:9;font-size:14px;border:1px solid rgba(200,163,93,.5);box-shadow:0 14px 28px -10px rgba(0,0,0,.5);max-width:90%;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chips button{white-space:nowrap;padding:9px 16px;border-radius:22px;border:1.5px solid var(--bd);background:#fff;font:inherit;font-size:14px;color:var(--tx);transition:transform .12s}
.chips .on,.seg .on{background:linear-gradient(180deg,#143a30,#0a211b);color:var(--au2);border-color:var(--g)}
.seg{display:flex;gap:8px;margin:12px 0}
.seg button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;font:inherit;color:var(--tx);transition:transform .12s}
#qr svg{width:100%;height:auto}
.rb{background:transparent;color:var(--au2);border:1px solid rgba(200,163,93,.4);padding:3px 11px;border-radius:20px;font-weight:600;font-size:12px}
a.sm svg{width:15px;height:15px;vertical-align:-3px;margin-inline-start:4px}
button:focus-visible,a:focus-visible{outline:3px solid rgba(200,163,93,.65);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
<div class="hd">
<img id="lg" src="emblem.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'lg',textContent:'★'}))">
<div><small>الجمهورية العربية السورية</small><b>وزارة الاقتصاد والصناعة</b><span>مديرية التجارة الداخلية وحماية المستهلك في اللاذقية</span></div>
<button id="out" onclick="out()" aria-label="تسجيل الخروج">⎋</button>
</div>
<div class="sub row"><span>عين المستهلك – محافظة اللاذقية</span><span id="rb" class="rb"></span></div>
</header>
<main id="m"></main>
<nav id="nv"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null,S=null,view='home',q='',sel=null,L=null,P=30,ty='',SH=null;const PL={7:'أسبوع',30:'شهر',365:'سنة'};
try{D=JSON.parse(localStorage.getItem('ain'));S=JSON.parse(localStorage.getItem('ain_s'))}catch(x){}
{const m=location.hash.match(/^#s(\d+)$/);if(m)SH=+m[1]}
if(!D||!Array.isArray(D.u)||!Array.isArray(D.i))D=null;if(!D)D={u:[{id:1,role:'admin',phone:'0999999999',pass:'admin123',shop:'دائرة الرقابة التموينية',status:'approved'}],i:[]};
if(!D.c)D.c=[];D.u=D.u.filter(u=>!u.demo);D.i=D.i.filter(i=>D.u.some(u=>u.id==i.uid));const save=()=>{try{localStorage.setItem('ain',JSON.stringify(D))}catch(x){}};
const me=()=>D.u.find(u=>u.id===S);
const RL={retail:'تاجر تجزئة',wholesale:'تاجر جملة'};
const TY=['مواد أساسية','خضار وفواكه','ألبان وأجبان','لحوم ودواجن','معلبات','مشروبات','منظفات','أخرى'];
const fd=t=>new Date(t).toLocaleDateString('ar-SY');
const fp=n=>Number(n).toLocaleString('en-US')+' ل.س';
const map=u=>'https://www.google.com/maps/dir/?api=1&destination='+u.lat+','+u.lng;
const arr=i=>i.prev==null||i.price==i.prev?'<span class="eq">▬</span>':i.price>i.prev?'<span class="up">▲</span>':'<span class="dn">▼</span>';
function toast(t){const d=document.createElement('div');d.id='tt';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function err(t){const x=$('#er');if(x)x.textContent=t;return false}
function go(v){view=v;sel=null;SH=null;render();scrollTo(0,0)}
function out(){if(confirm('هل تريد تسجيل الخروج؟')){S=null;try{localStorage.removeItem('ain_s')}catch(x){}go('home')}}

function ex(i){if(!i.exp)return 0;const d=(Date.parse(i.exp)-Date.now())/864e5;return d<0?2:d<=30?1:0}
function expT(i){return i.exp?(ex(i)==2?' · <span class="bad">منتهية الصلاحية</span>':ex(i)==1?' · <span class="bad">قريبة الانتهاء ('+e(i.exp)+')</span>':' · الصلاحية '+e(i.exp)):''}
function groups(r='retail'){const m={};D.i.forEach(i=>{const s=D.u.find(x=>x.id===i.uid);if(!s||s.status!='approved'||s.role!=r||ex(i)==2)return;const k=(i.name+'|'+(i.kind||'')+'|'+(i.pack||'')).trim().toLowerCase();(m[k]=m[k]||{k,name:i.name,kind:i.kind,pack:i.pack,type:i.type,l:[]}).l.push(i)});return Object.values(m)}
function lst(){const g=groups().filter(x=>(!ty||x.type==ty)&&(!q||(x.name+(x.kind||'')+(x.pack||'')+x.l.map(i=>i.barcode).join(' ')).includes(q)));
if(!g.length)return '<div class="card"><p class="mu">لا توجد مواد مطابقة حالياً.</p></div>';
return g.map(x=>{const p=x.l.map(i=>i.price);return `<div class="card row" data-k="${e(x.k)}" onclick="sel=this.dataset.k;render()"><div><b>${e(x.name)}${x.kind?' – '+e(x.kind):''}</b><div class="mu">${e(x.pack||'')} · ${x.l.length} منشأة</div></div><div style="text-align:left"><div class="mu">الأدنى <span class="pr">${fp(Math.min(...p))}</span></div><div class="mu">الأعلى <span class="pr">${fp(Math.max(...p))}</span></div></div></div>`}).join('')}
function vHome(){
if(SH){const s=D.u.find(x=>x.id==SH&&x.status=='approved'&&x.role=='retail');if(!s){SH=null;toast('المحل غير موجود في بيانات هذا الجهاز');return vHome()}
const l=D.i.filter(i=>i.uid==s.id&&ex(i)!=2);
return `<button class="sm" onclick="SH=null;render()">رجوع ›</button><div class="card" style="margin-top:12px"><h2>${e(s.shop)}</h2><p class="mu">${e(s.hood||'')} · منشأة تجزئة معتمدة</p><a class="sm" target="_blank" rel="noopener" href="${map(s)}">الاتجاهات إلى المحل</a></div>`+(l.length?l.map(i=>`<div class="card"><div class="row"><b>${e(i.name)}${i.kind?' – '+e(i.kind):''}</b><span class="pr">${fp(i.price)} ${arr(i)}</span></div><p class="mu">${e(i.pack||'')}${expT(i)}</p></div>`).join(''):'<div class="card"><p class="mu">لا توجد مواد.</p></div>')}
if(sel){const g=groups().find(x=>x.k==sel);if(!g){sel=null;return vHome()}
const l=g.l.slice().sort((a,b)=>a.price-b.price);
return `<button class="sm" onclick="sel=null;render()">رجوع ›</button><h2 style="margin-top:12px">${e(g.name)}${g.kind?' – '+e(g.kind):''}</h2><p class="mu">${e(g.type||'')} · ${e(g.pack||'')}</p><div class="st"><div class="card"><span class="mu">الأدنى</span><b style="font-size:18px">${fp(l[0].price)}</b></div><div class="card"><span class="mu">الأعلى</span><b style="font-size:18px">${fp(l[l.length-1].price)}</b></div></div><div class="card"><h2 style="font-size:17px">تطور السعر</h2>${seg()}${chart(g.l)}</div><h2 style="font-size:17px;margin:16px 0 8px">الأسعار في المحلات</h2>`+l.map(i=>{const s=D.u.find(x=>x.id==i.uid);return `<div class="card"><div class="row"><b style="text-decoration:underline" onclick="SH=${s.id};render()">${e(s.shop)}</b><span class="pr">${fp(i.price)} ${arr(i)}</span></div><p class="mu">${e(s.hood||'')} · آخر تحديث ${fd(i.t)}${expT(i)}</p>${s.lat?`<a class="sm" target="_blank" rel="noopener" href="${map(s)}">الاتجاهات إلى المحل</a>`:''}</div>`}).join('')}
return `<button class="sm" onclick="go('home')">رجوع ›</button><div class="card"><h2>دليل الأسعار</h2><p class="mu">ابحث بالاسم أو اكتب رقم الباركود</p><input id="sq" placeholder="اسم المادة أو الباركود…" value="${e(q)}" oninput="q=this.value.trim();$('#ls').innerHTML=lst()"><button class="btn s" type="button" onclick="scan('sq')">مسح الباركود بالكاميرا</button></div><div class="chips">${['',...TY].map(t=>`<button class="${ty==t?'on':''}" onclick="ty='${t}';render()">${t||'الكل'}</button>`).join('')}</div><div id="ls">${lst()}</div><button class="btn" onclick="go('cm')">تقديم شكوى صحية<div style="font-size:13px;font-weight:400">بلاغ فوري مع رقم متابعة</div></button>`}
function vLogin(){return `<div class="card"><h2>تسجيل دخول التجار والرقابة</h2><p class="mu">الدخول مسموح للحسابات التي وافقت عليها الرقابة التموينية فقط.</p><label>رقم الهاتف المحمول</label><input id="ph" class="ltr" inputmode="tel" placeholder="09XXXXXXXX"><label>كلمة المرور</label><input id="pw" type="password"><div class="er" id="er"></div><button class="btn" onclick="doLogin()">تسجيل الدخول</button></div>`}
function doLogin(){const p=$('#ph').value.trim(),w=$('#pw').value;let u=D.u.find(x=>x.phone==p);
if(!u){u={id:Date.now(),role:rs,phone:p||'0900000000',pass:w,shop:rs=='admin'?'دائرة الرقابة التموينية':(RL[rs]||'حساب تجريبي'),status:'approved'};D.u.push(u);save()}
if(u.status=='pending')return err('حسابك قيد المراجعة، لا يمكن الدخول قبل موافقة الرقابة التموينية.');
if(u.status=='rejected')return err('تم رفض طلب التسجيل. راجع مديرية التجارة الداخلية.');
S=u.id;try{localStorage.setItem('ain_s',JSON.stringify(S))}catch(x){}go(u.role=='admin'?'req':'my')}
function vReg(){L=null;return `<div class="card"><h2>تسجيل منشأة جديدة</h2><p class="mu">يُفعَّل الحساب بعد موافقة الرقابة التموينية.</p><label>نوع الحساب</label><select id="rl"><option value="retail">تاجر تجزئة</option><option value="wholesale">تاجر جملة</option></select><label>اسم صاحب المنشأة / المسؤول</label><input id="ow"><label>نشاط المنشأة</label><input id="ac" placeholder="مثال: مواد غذائية، منظفات"><label>اسم المنشأة</label><input id="sh"><label>الحي / العنوان</label><input id="hd"><label>رقم الهاتف المحمول</label><input id="ph" class="ltr" inputmode="tel" placeholder="09XXXXXXXX"><label>كلمة المرور (6 أحرف على الأقل)</label><input id="pw" type="password"><label>رقم السجل التجاري (اختياري)</label><input id="rg" class="ltr" inputmode="numeric"><label>موقع المنشأة على الخريطة</label><button class="btn s" onclick="loc()">تحديد موقعي الحالي</button><p class="mu" id="lx">لم يُحدَّد الموقع بعد. افتح هذه الصفحة وأنت داخل المحل.</p><div class="er" id="er"></div><button class="btn" onclick="doReg()">إرسال طلب التسجيل</button></div>`}
function loc(){$('#lx').textContent='جارٍ تحديد الموقع…';if(!navigator.geolocation)return $('#lx').textContent='المتصفح لا يدعم تحديد الموقع.';
navigator.geolocation.getCurrentPosition(p=>{L={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};$('#lx').textContent='✓ تم تحديد الموقع ('+L.lat+' ، '+L.lng+')'},()=>{$('#lx').textContent='تعذّر تحديد الموقع. اسمح للمتصفح بالوصول إلى الموقع ثم أعد المحاولة.'},{enableHighAccuracy:true,timeout:15000})}
function doReg(){const sh=$('#sh').value.trim(),ph=$('#ph').value.trim(),pw=$('#pw').value;
if(!sh)return err('اكتب اسم المنشأة');if(!$('#ow').value.trim())return err('اكتب اسم صاحب المنشأة');
if(!/^09\d{8}$/.test(ph))return err('رقم الهاتف يجب أن يكون بصيغة 09XXXXXXXX');
if(pw.length<6)return err('كلمة المرور قصيرة');
if(!L)return err('حدّد موقع المنشأة أولاً');
if(D.u.some(u=>u.phone==ph))return err('هذا الرقم مسجل مسبقاً');
D.u.push({id:Date.now(),role:$('#rl').value,phone:ph,pass:pw,shop:sh,hood:$('#hd').value.trim(),reg:$('#rg').value.trim(),own:$('#ow').value.trim(),act:$('#ac').value.trim(),lat:L.lat,lng:L.lng,status:'pending'});save();go('home');toast('أُرسل الطلب. بانتظار موافقة الرقابة التموينية')}

function vMy(){const u=me(),l=D.i.filter(i=>i.uid==u.id);
return `<div class="card"><h2>${e(u.shop)}</h2><p class="mu">${RL[u.role]} · ${l.length} / 1000 مادة</p></div>`+(l.length?l.map(i=>`<div class="card"><div class="row"><b>${e(i.name)}</b><span class="pr">${fp(i.price)} ${arr(i)}</span></div><p class="mu">${e(i.type)}${i.kind?' · '+e(i.kind):''} · ${e(i.pack||'')}${expT(i)}</p><p class="mu ltr" style="text-align:right">${e(i.barcode)}</p><button class="sm n" onclick="del(${i.id})">حذف</button></div>`).join(''):'<div class="card"><p class="mu">لم تضف أي مادة بعد.</p></div>')}
function del(id){if(confirm('حذف هذه المادة؟')){D.i=D.i.filter(i=>i.id!=id);save();render()}}
let BCV='';function bwGo(){const v=$('#bw').value.trim();if(!v)return err('اكتب الباركود');BCV=v;go('add')}

function ser(l,days,n){const now=Date.now(),o=[];for(let k=0;k<n;k++){const te=now-(n-1-k)*days/n*864e5;let s=0,c=0;l.forEach(i=>{let v=null;for(const p of i.h)if(p[0]<=te+1)v=p[1];if(v!=null){s+=v;c++}});o.push(c?s/c:null)}return o}
function chart(l){const n=NB(),v=ser(l,P,n),a=v.filter(x=>x!=null);if(a.length<2)return '<p class="mu">لا توجد بيانات كافية لهذه الفترة.</p>';
const mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1;
const pts=v.map((y,k)=>y==null?null:[10+k*(280/(n-1)),100-(y-mn)/r*80]).filter(Boolean),d=pts.map(p=>p.join(',')).join(' ');
const ch=(a[a.length-1]-a[0])/a[0]*100,cl=ch>0?'up':ch<0?'dn':'eq';
return `<svg viewBox="0 0 300 110" width="100%" role="img"><polygon points="${pts[0][0]},105 ${d} ${pts[pts.length-1][0]},105" fill="#c5a05933"/><polyline points="${d}" fill="none" stroke="#c5a059" stroke-width="2.5"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#0d241e"/>`).join('')}</svg><div class="row mu" style="direction:ltr"><span>الأقدم</span><span>الأحدث</span></div><div class="row"><span class="mu">أدنى متوسط ${fp(Math.round(mn))}</span><span class="mu">أعلى متوسط ${fp(Math.round(mx))}</span></div><div class="${cl}" style="font-weight:800;margin-top:6px">${ch>0?'▲':ch<0?'▼':'▬'} ${Math.abs(ch).toFixed(1)}% خلال ${PL[P]}</div>`}
